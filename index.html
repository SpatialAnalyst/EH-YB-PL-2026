<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>EH-YB-PL-2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: branch tabs, one search bar, one list, a sticky basket bar with the total. Built for a phone in the showroom. */
:root{--bg:#f6f4ef;--panel:#fff;--fg:#1d1f24;--muted:#6b6e76;--line:#d9d5cc;--accent:#1f3a5f;--accent-fg:#fff;--offer:#b3261e;--offer-bg:#fdecea;--input:#fff7d6;--sel:#e8eef6;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--panel:#1e2127;--fg:#e8e6e1;--muted:#9a9ea8;--line:#343841;--accent:#7fa6d9;--accent-fg:#101317;--offer:#ff8a8a;--offer-bg:#44201f;--input:#3a3520;--sel:#232b38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171b;--panel:#1e2127;--fg:#e8e6e1;--muted:#9a9ea8;--line:#343841;--accent:#7fa6d9;--accent-fg:#101317;--offer:#ff8a8a;--offer-bg:#44201f;--input:#3a3520;--sel:#232b38;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.35;padding-block:0 96px;padding-inline:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:3;padding-block:10px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
h1{font-size:20px;margin:0}
.meta{color:var(--muted);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:14px;padding:5px 12px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input,select{font:inherit;color:var(--fg);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
#q{flex:1 1 220px}
main{max-width:1100px;margin:0 auto}
.offers{margin-top:12px;display:grid;gap:8px}
.offer{background:var(--offer-bg);border:1px solid var(--offer);border-radius:8px;padding:8px 12px}
.offer b{color:var(--offer)}
.cnt{color:var(--muted);font-size:12px;margin:12px 0 6px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.cnt .sp{flex:1}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:14px 0 4px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.item.on{background:var(--sel);border-color:var(--accent)}
.item input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.name{font-weight:600}
.sub{color:var(--muted);font-size:13px}
.price{font-size:19px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.was{text-decoration:line-through;color:var(--muted);font-size:13px;font-weight:400;display:block}
.op{color:var(--offer)}
.qty{grid-column:2/4;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:4px}
.qty button{font:inherit;font-weight:700;width:30px;height:30px;border-radius:15px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px;background:var(--line);color:var(--fg);margin-left:6px}
.tag.o{background:var(--offer);color:#fff}
.qty{flex-wrap:wrap}
.disc{flex-basis:100%;color:var(--offer);font-weight:600}
.more{text-align:center;color:var(--muted);padding:10px}
footer{color:var(--muted);font-size:12px;margin-top:20px}
.basket{position:fixed;left:0;right:0;bottom:0;background:var(--accent);color:var(--accent-fg);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:4;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
.basket .tot{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
.basket button{font:inherit;font-weight:600;border:1px solid var(--accent-fg);background:none;color:var(--accent-fg);border-radius:6px;padding:5px 10px;cursor:pointer}
.basket .lbl{font-size:13px;opacity:.85}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:8px 14px;border-radius:6px;font-weight:600;z-index:9}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
[hidden]{display:none!important}
.gate{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.gate form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:340px;width:100%;display:grid;gap:12px}
.gate h2{margin:0;font-size:20px}
.gate input{font-size:18px;letter-spacing:.08em}
.gate button{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:10px;cursor:pointer}
.gate p{margin:0;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="gate" id="gate" hidden><form id="gform" autocomplete="off">
  <h2>EH-YB-PL-2026</h2>
  <p id="gmsg"></p>
  <input id="gcode" type="password" inputmode="text" placeholder="Passcode" aria-label="Passcode" autocapitalize="none" autocorrect="off" spellcheck="false">
  <button type="submit">Open</button>
  <p>For staff only. Ask your manager for the passcode.</p>
</form></div>
<header>
  <h1>EH-YB-PL-2026</h1>
  <div class="meta" id="meta">Loading…</div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="bar">
    <input id="q" placeholder="Search product, collection, code…" autocomplete="off">
    <select id="brand"></select>
    <select id="cat"><option value="">All categories</option></select>
    <select id="coll"><option value="">All collections</option></select>
  </div>
</header>
<main>
  <div class="offers" id="offers"></div>
  <div class="cnt"><span id="cnt"></span><span class="sp"></span><label><input type="checkbox" id="onlysel"> Show ticked only</label></div>
  <div id="list"></div>
  <footer>Prices in Iraqi dinar. The date above says which price list this is. Offer prices apply only between the dates shown and only in the branch selected. Tick products to add them up.</footer>
</main>
<div class="basket" id="basket" hidden>
  <span class="lbl" id="bcount"></span>
  <button id="bcopy">Copy list</button>
  <button id="bclear">Clear</button>
  <span class="tot" id="btotal"></span>
</div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);const fmt=n=>Math.round(n).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BRAND={Enza:'Enza Home',Yatas:'Yataş Bedding'};
let D=null,P=[],branch=null,offerMap={},basket={};
const TYPE=new Set(['base','headboard','mattress','topper','pillow','quilt','duvet','sheet','protector','blanket','bedspread','towel','bathrobe','cover','sofa','armchair','corner','ottoman','recliner','module','daybed','table','chair','bench','bookcase','carpet','rug','lamp','lighting','accessory','tv','unit','wardrobe','bed','dresser','mirror','nightstand','sideboard','console','bedroom','dining','textile','upholstery','panel','complementary','seat']);
const CATW=new Set(['lighting','carpet','accessory','complementary']);
let CW=new Set(),AMB=new Set();
// One search can hold several items. A model name starts a new item; sizes and types after it belong to that item.
function hits(names,rest,pool,strictOnly){const types=rest.filter(w=>TYPE.has(w)),oth=rest.filter(w=>!TYPE.has(w));
  const f=st=>pool.filter(p=>names.every(w=>(st?p.n:p.s).includes(w))&&oth.every(w=>p.s.includes(w))&&(!types.length||types.some(w=>p.s.includes(w))));
  let r=f(true);if(!r.length&&!strictOnly&&names.length)r=f(false);return r;}
function parse(words,pool){const gs=[];let cur=null;
  words.forEach(w=>{
    if(CATW.has(w)){if(cur&&!cur.cat&&cur.names.length&&hits(cur.names,[w],pool,true).length){cur.rest.push(w);return;}cur={names:[],rest:[w],cat:1};gs.push(cur);return;}
    if(CW.has(w)){
      if(cur&&!cur.cat){
        if(hits(cur.names.concat(w),cur.rest,pool,true).length){cur.names.push(w);return;}
        if(AMB.has(w)&&hits(cur.names,cur.rest.concat(w),pool).length){cur.rest.push(w);return;}}
      cur={names:[w],rest:[]};gs.push(cur);return;}
    if(!cur){cur={names:[],rest:[]};gs.push(cur);}
    cur.rest.push(w);});
  return gs;}
function itemHtml(p){const o=offerMap[p.k],on=basket[p.k];
  return `<div class="item ${on?'on':''}" data-k="${esc(p.k)}"><input type="checkbox" ${on?'checked':''} aria-label="Add to total"><div><div class="name">${esc(p.name)}${p.av&&p.av!=='Available'?`<span class="tag">${esc(p.av)}</span>`:''}${o?`<span class="tag o">${esc(o.name)}</span>`:''}</div><div class="sub">${esc([p.v1,p.v2].filter(Boolean).join(' · '))}${p.code?' · '+esc(p.code):''}</div></div>
    <div class="price">${o?`<span class="was">${fmt(p.price)}</span><span class="op">${fmt(o.price)}</span>`:fmt(p.price)}</div>
    ${on?`<div class="qty"><button data-d="-1" aria-label="Less">−</button><span>${on} × ${fmt(priceOf(p))} = <b>${fmt(on*priceOf(p))}</b></span><button data-d="1" aria-label="More">+</button>${p.low&&!o?`<span class="disc">Max ${Math.round(p.disc*100)}% · lowest ${fmt(p.low)} each</span>`:''}</div>`:''}</div>`;}
let toastT=null;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2000);}
function today(){return new Date().toISOString().slice(0,10);}
function fill(sel,vals,first){const v=sel.value;sel.innerHTML=`<option value="">${first}</option>`+vals.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(vals.includes(v))sel.value=v;}
function priceOf(p){const o=offerMap[p.k];return o?o.price:p.price;}
function setBranch(slug,push){branch=D.branches.find(b=>b.slug===slug)||D.branches[0];
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.slug===branch.slug)));
  if(push){try{history.replaceState(null,'','#'+branch.slug);}catch(e){}}
  const t=today();offerMap={};const act=(branch.offers||[]).filter(o=>o.start<=t&&t<=o.end);act.forEach(o=>o.items.forEach(i=>{offerMap[i.k]={name:o.name,price:i.price};}));
  $('#offers').innerHTML=act.map(o=>`<div class="offer"><b>${esc(o.name)}</b> · ${o.start} to ${o.end} · ${o.items.length} products</div>`).join('');
  const brands=branch.brands;$('#brand').innerHTML=(brands.length>1?'<option value="">All brands</option>':'')+brands.map(b=>`<option value="${b}">${BRAND[b]}</option>`).join('');
  $('#meta').textContent=`${branch.name} · prices as of ${D.built}`;
  try{localStorage.setItem('branch',branch.slug);}catch(e){}
  render();renderBasket();}
function render(){const q=$('#q').value.trim().toLowerCase(),b=$('#brand').value,only=$('#onlysel').checked;
  const base=P.filter(p=>branch.brands.includes(p.b)&&(!b||p.b===b));fill($('#cat'),[...new Set(base.map(p=>p.cat))].sort(),'All categories');
  const c=$('#cat').value;const base2=base.filter(p=>!c||p.cat===c);fill($('#coll'),[...new Set(base2.map(p=>p.coll))].sort(),'All collections');
  const coll=$('#coll').value;
  const norm=s=>s.replace(/\bthree\b/g,'3').replace(/\btwo\b/g,'2').replace(/\bone\b/g,'1').replace(/\bseater\b/g,'seat').replace(/(\d)\s*-\s*seat/g,'$1 seat');
  const words=norm(q).replace(/[,+&]/g,' ').replace(/\b(and|with|or)\b/g,' ').split(/\s+/).filter(Boolean);
  const pool=base2.filter(p=>(!coll||p.coll===coll)&&(!only||basket[p.k]));
  const gs=parse(words,pool);let html='';
  if(gs.length<2){const rows=gs.length?hits(gs[0].names,gs[0].rest,pool):pool;
    $('#cnt').textContent=rows.length+' products';
    const LIM=300;let last='';
    rows.slice(0,LIM).forEach(p=>{const g=BRAND[p.b]+' · '+p.cat+' · '+p.coll;if(g!==last){html+=`<div class="grp">${esc(g)}</div>`;last=g;}html+=itemHtml(p);});
    if(rows.length>LIM)html+=`<div class="more">Showing ${LIM} of ${rows.length}. Search or filter to see the rest.</div>`;}
  else{const GL=40,seen=new Set();let tot=0;
    gs.forEach(g=>{const label=g.names.concat(g.rest).join(' ');const rows=hits(g.names,g.rest,pool).filter(p=>!seen.has(p.k));rows.forEach(p=>seen.add(p.k));tot+=rows.length;
      html+=`<div class="grp">${esc(label)} · ${rows.length} product${rows.length===1?'':'s'}</div>`;
      if(!rows.length)html+=`<div class="more">Nothing found for “${esc(label)}” in this branch.</div>`;
      rows.slice(0,GL).forEach(p=>{html+=itemHtml(p);});
      if(rows.length>GL)html+=`<div class="more">Showing ${GL} of ${rows.length}. Add a size or type after “${esc(g.names[0]||g.rest[0])}” to narrow it.</div>`;});
    $('#cnt').textContent=tot+' products · '+gs.length+' items searched';}
  $('#list').innerHTML=html;}
function renderBasket(){const ks=Object.keys(basket);const bk=$('#basket');if(!ks.length){bk.hidden=true;return;}bk.hidden=false;
  let tot=0,n=0;ks.forEach(k=>{const p=P.find(x=>x.k===k);if(p){tot+=basket[k]*priceOf(p);n+=basket[k];}});
  $('#bcount').textContent=`${ks.length} product${ks.length>1?'s':''} · ${n} unit${n>1?'s':''}`;$('#btotal').textContent=fmt(tot)+' IQD';}
$('#list').addEventListener('click',e=>{const d=e.target.closest('button[data-d]');const it=e.target.closest('.item');if(!it)return;const k=it.dataset.k;
  if(d){e.preventDefault();basket[k]=(basket[k]||1)+ (+d.dataset.d);if(basket[k]<=0)delete basket[k];}
  else{if(basket[k])delete basket[k];else basket[k]=1;}
  render();renderBasket();});
$('#bclear').addEventListener('click',()=>{basket={};render();renderBasket();});
$('#bcopy').addEventListener('click',()=>{const lines=Object.keys(basket).map(k=>{const p=P.find(x=>x.k===k);return p?`${basket[k]} × ${p.name} ${[p.v1,p.v2].filter(Boolean).join(' ')} — ${fmt(basket[k]*priceOf(p))} IQD`:'';}).filter(Boolean);
  const txt=lines.join('\n')+'\nTotal: '+$('#btotal').textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('Copied'),()=>toast('Could not copy'));}else toast('Could not copy');});
['#q','#brand','#cat','#coll','#onlysel'].forEach(s=>$(s).addEventListener(s==='#q'?'input':'change',render));
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-slug]');if(b){basket={};setBranch(b.dataset.slug,true);}});
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(D&&D.branches.some(b=>b.slug===h))setBranch(h,false);});
function start(d){D=d;P=d.products.map(p=>({...p,s:(p.name+' '+p.coll+' '+p.cat+' '+p.code+' '+p.v1+' '+p.v2).toLowerCase().replace(/\bseater\b/g,'seat'),n:(p.name+' '+p.coll).toLowerCase()}));
  const tk=x=>String(x||'').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean),vc={};P.forEach(p=>tk(p.v1+' '+p.v2).forEach(w=>{vc[w]=(vc[w]||0)+1;}));
  P.forEach(p=>tk(p.coll).forEach(w=>{if(w.length>1&&!TYPE.has(w)&&!/^\d+$/.test(w)){CW.add(w);if(vc[w]>=3)AMB.add(w);}}));
  $('#tabs').innerHTML=d.branches.map(b=>`<button role="tab" data-slug="${b.slug}" aria-selected="false">${esc(b.name)}</button>`).join('');
  let h=location.hash.replace('#','');if(!d.branches.some(b=>b.slug===h)){try{h=localStorage.getItem('branch')||'';}catch(e){h='';}}
  setBranch(h,false);}
// Passcode gate: the price data is stored encrypted and is opened on this device with the passcode.
const ITER=200000,gate=$('#gate'),gmsg=$('#gmsg'),gin=$('#gcode');
async function unlock(code){const r=await fetch('data.enc',{cache:'no-cache'});if(!r.ok)throw new Error('load');
  const u=new Uint8Array(await r.arrayBuffer()),salt=u.slice(8,16),ct=u.slice(16);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},km,384));
  const key=await crypto.subtle.importKey('raw',bits.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
  let pt;try{pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,ct);}catch(e){throw new Error('code');}
  let d;try{d=JSON.parse(new TextDecoder().decode(pt));}catch(e){throw new Error('code');}
  if(!d||!d.products)throw new Error('code');return d;}
async function tryCode(code,typed){gmsg.textContent='Opening…';
  try{const d=await unlock(code);try{localStorage.setItem('pl_code',code);}catch(e){}gate.hidden=true;start(d);}
  catch(e){gate.hidden=false;gmsg.textContent=e.message==='code'?(typed?'Wrong passcode. Try again.':'Enter the passcode to open the price list.'):'Could not load the price list. Check the internet and try again.';if(e.message==='code'){try{localStorage.removeItem('pl_code');}catch(x){}}gin.focus();}}
$('#gform').addEventListener('submit',e=>{e.preventDefault();const c=gin.value.trim();if(c)tryCode(c,true);});
let saved='';try{saved=localStorage.getItem('pl_code')||'';}catch(e){}
if(saved)tryCode(saved,false);else{gate.hidden=false;gmsg.textContent='Enter the passcode to open the price list.';}

})();
</script>

</body>
</html>
